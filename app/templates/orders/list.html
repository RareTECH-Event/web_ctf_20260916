{% extends "base.html" %}
{% block title %}注文履歴 - Web CTF{% endblock %}
{% block content %}
<h1>注文履歴</h1>
{% for order in orders %}
<div class="card">
  <p>注文番号: {{ order['id'] }}</p>
  <p>注文日時: {{ order['created_at'] }}</p>
  <p>合計金額: &yen;{{ "{:,}".format(order['total']) }}</p>
  <p><a href="{{ url_for('orders.order_detail', order_id=order['id']) }}">注文詳細を見る</a></p>
</div>
{% else %}
<p>注文履歴はまだありません。</p>
{% endfor %}
{% endblock %}
